<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiki Tempest — the beach happy hour cocktail game</title>
<link rel="stylesheet" href="css/style.css?v=34">
</head>
<body>

<div id="menu">
  <h1 class="burgee">Tiki Tempest</h1>
  <div class="tag">stock the bar &middot; serve the menu &middot; watch the sky
    <span style="opacity:.55">· build 34</span></div>
  <div class="cardfan">
    <img src="assets/cards/back-main.jpg" alt="">
    <img src="assets/cards/recipe-mai-tai.jpg" alt="Mai Tai">
    <img src="assets/cards/sp-thieving-seagull.jpg" alt="Thieving Seagull">
  </div>
  <div id="gallery"><img id="galleryImg" alt=""></div>

  <div class="panel">
    <div class="row">
      <div>
        <label for="mName">Your name</label>
        <input type="text" id="mName" maxlength="16" value="Bartender">
      </div>
      <div>
        <label for="mMode">How to play</label>
        <select id="mMode">
          <option value="draft" selected>Draft — pick &amp; pass (Sushi Go style)</option>
          <option value="classic">Classic — bartender turns</option>
        </select>
      </div>
      <div>
        <label for="mDeck">Bar stock</label>
        <select id="mDeck">
          <option value="stocked" selected>Well-stocked — extra rum (recommended)</option>
          <option value="printed">Printed deck — 135 cards, rum runs scarce</option>
        </select>
      </div>
      <div>
        <label for="mRounds">Session</label>
        <select id="mRounds">
          <option value="1">Quick pour — 1 round</option>
          <option value="2" selected>Happy hour — 2 rounds</option>
          <option value="3">Full luau — 3 rounds</option>
        </select>
      </div>
      <div>
        <label for="mAI">AI difficulty</label>
        <select id="mAI">
          <option value="regular" selected>Regular — friendly rivals</option>
          <option value="hard">Hard — sharks (they race your serves)</option>
        </select>
      </div>
      <div>
        <label for="mBots">Rival bartenders (AI)</label>
        <select id="mBots">
          <option value="1">1 rival</option>
          <option value="2" selected>2 rivals</option>
          <option value="3">3 rivals</option>
          <option value="4">4 rivals</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="gold" id="btnSolo">Open the bar (vs AI)</button>
      <button id="btnTour">🎓 Learn to play</button>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div>
        <label for="mRoom">Online — room code</label>
        <input type="text" id="mRoom" maxlength="8" placeholder="e.g. LUAU" style="text-transform:uppercase">
      </div>
    </div>
    <div class="actions">
      <button id="btnHost">Host a bar</button>
      <button id="btnJoin">Join a bar</button>
    </div>
    <div class="err" id="mErr"></div>
    <div style="margin-top:6px">
      <button class="ghost" id="btnMusic2" title="Toggle music">🎵</button>
      <button class="ghost" id="btnSound2" title="Toggle sound">🔊</button>
    </div>
    <div style="color:var(--dim);font-size:13px">Host, share the code, friends join from anywhere.
      <a href="RULES.md" target="_blank">Read the full rules</a>.</div>
  </div>
</div>

<div id="table">
  <div id="topbar">
    <span class="script">Tiki Tempest</span>
    <span class="round" id="tRound"></span>
    <span class="spacer"></span>
    <span class="netcode" id="tNet"></span>
    <span style="color:#9c6a3f;font-size:12px">b34</span>
    <button class="ghost" id="btnMusic" title="Toggle music">🎵</button>
    <button class="ghost" id="btnTrack" title="Next track" style="display:none">⏭</button>
    <button class="ghost" id="btnSound" title="Toggle sound">🔊</button>
    <button class="ghost" id="btnTourTop" title="Guided tour">?</button>
    <button class="ghost" id="btnRules">Rules</button>
    <button class="ghost" id="btnQuit">Leave bar</button>
  </div>
  <div id="oppRow"></div>
  <div id="centerRow">
    <div id="piles"></div>
    <div id="menuRow"><div class="menuLabel">🍹 Drink Menu</div><div id="menuCards"></div></div>
    <div id="logCol">
      <div id="log"></div>
      <div id="chatBox">
        <input id="chatInput" maxlength="140" placeholder="table talk…">
        <button id="chatSend" title="Send">➤</button>
      </div>
    </div>
  </div>
  <div id="myArea">
    <div id="myBar">
      <div id="prompt"></div>
      <div id="barRow"><span class="barLabel">My bar:</span><span id="barCards"></span></div>
      <div id="handRow"></div>
      <div id="myStatus"></div>
    </div>
  </div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="assets/music/playlist.js"></script>
<script src="js/data.js?v=34"></script>
<script src="js/sound.js?v=34"></script>
<script src="js/engine-classic.js?v=34"></script>
<script src="js/engine-draft.js?v=34"></script>
<script src="js/ai-classic.js?v=34"></script>
<script src="js/ai-draft.js?v=34"></script>
<script src="js/net.js?v=34"></script>
<script src="js/ui.js?v=34"></script>
<script src="js/tour.js"></script>
<script src="js/main.js?v=34"></script>
</body>
</html>
